    .cap { font-size: 11px; letter-spacing: 1.4px; fill: #807d75; }
    .hl { opacity: 0; animation: on 8s infinite both; }
    .plate { animation: lift 8s infinite both; }
    .p1 { animation-delay: 2s; } .p2 { animation-delay: 4s; } .p3 { animation-delay: 6s; }
    .spine { animation: flow 1.2s linear infinite; }
    @keyframes on { 0% { opacity: 0 } 3%, 22% { opacity: 1 } 26%, 100% { opacity: 0 } }
    @keyframes lift { 0% { transform: translateY(0) } 3%, 22% { transform: translateY(-12px) } 26%, 100% { transform: translateY(0) } }
    @keyframes flow { to { stroke-dashoffset: -14 } }
    @media (prefers-reduced-motion: reduce) { .hl, .plate, .spine { animation: none; } .hl.p0 { opacity: 1; } }
  </style>
