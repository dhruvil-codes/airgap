      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e222b"/><stop offset="1" stop-color="#15181f"/></linearGradient>
    <linearGradient id="plateLive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#461e0e"/><stop offset="1" stop-color="#26130b"/></linearGradient>
    <radialGradient id="stage" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#15181f"/><stop offset="1" stop-color="#0b0d11"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.04)"/></pattern>
  </defs>
  <style>
    .sans { font-family: "Geist", "Geist Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
