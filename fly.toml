app = "airgap-mcp"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "serve --host 0.0.0.0 --port 8080"

[env]
  AIRGAP_HOST = "0.0.0.0"
  AIRGAP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
